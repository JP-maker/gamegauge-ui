server {
    listen 80;
    listen [::]:80;
    server_name gamegauge.fr www.gamegauge.fr;

    # Bloc de validation Let's Encrypt standard
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste redirige vers HTTPS, directement sur le domaine nu :
    # http://www… n'a ainsi qu'un seul saut à faire, pas deux.
    location / {
        return 301 https://gamegauge.fr$request_uri;
    }
}

# --- www → domaine nu -------------------------------------------------------
# Servir le même site sur deux adresses, c'est présenter à Google deux sites
# au contenu identique, qui se partagent les liens entrants. Le certificat
# couvre déjà www : il suffit de rediriger.
server {
    listen 443 ssl;
    server_name www.gamegauge.fr;

    ssl_certificate /etc/letsencrypt/live/gamegauge.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamegauge.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://gamegauge.fr$request_uri;
}

server {
    listen 443 ssl;
    server_name gamegauge.fr;

    ssl_certificate /etc/letsencrypt/live/gamegauge.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamegauge.fr/privkey.pem;

    # --- Paramètres de sécurité SSL ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;


    # --- En-têtes de sécurité ---------------------------------------------
    # `always` : les en-têtes partent aussi sur les réponses d'erreur.
    #
    # La CSP est la seule protection réelle contre le vol du jeton JWT, qui
    # vit dans le localStorage : sans elle, un script injecté peut le lire et
    # l'exfiltrer. Les domaines listés sont exactement ceux que le site charge
    # — polices Google, reCAPTCHA, votre Umami. 'unsafe-inline' sur les styles
    # n'est pas évitable : Angular injecte les styles de composant en ligne.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.gamegauge.fr https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.gstatic.com; connect-src 'self' https://analytics.gamegauge.fr; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        root /usr/share/nginx/html;
        # add_header dans un location annule ceux du bloc server : les deux qui
        # comptent pour un .js servi sont donc répétés ici.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    # On réactive l'API (Backend)
    location /api/ {
        # On utilise le nom du service backend
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name analytics.gamegauge.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name analytics.gamegauge.fr;

    # On utilise le même certificat (on va le mettre à jour juste après)
    ssl_certificate /etc/letsencrypt/live/gamegauge.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamegauge.fr/privkey.pem;

    location / {
        proxy_pass http://umami:3000; # Umami tourne sur le port 3000
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}